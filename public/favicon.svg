<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Left audio soundwave bars -->
  <rect x="10" y="27" width="3.5" height="10" rx="1.75" fill="#a5b4fc" opacity="0.85"/>
  <rect x="16" y="20" width="3.5" height="24" rx="1.75" fill="#ffffff" opacity="0.95"/>

  <!-- Center YouTube Audio Play Badge -->
  <g filter="url(#glow)">
    <rect x="23" y="17" width="22" height="30" rx="7" fill="url(#playGrad)"/>
    <path d="M30 25.5C30 24.3 31.3 23.6 32.3 24.2L39.2 28.7C40.1 29.3 40.1 30.7 39.2 31.3L32.3 35.8C31.3 36.4 30 35.7 30 34.5V25.5Z" fill="#ffffff"/>
  </g>

  <!-- Right audio soundwave bars -->
  <rect x="48" y="20" width="3.5" height="24" rx="1.75" fill="#ffffff" opacity="0.95"/>
  <rect x="54" y="27" width="3.5" height="10" rx="1.75" fill="#a5b4fc" opacity="0.85"/>
</svg>
